<div class="container mt-5 p-4 shadow rounded bg-white">
  <h2 class="mb-4 text-center text-primary">
    {{ editIndex !== null ? 'Edit Task' : 'Create Task' }}
  </h2>

  <form (ngSubmit)="addData()">
    <div class="form-group mb-4">
      <label for="taskid" class="form-label fw-semibold">Task ID</label>
      <input type="text" id="taskid" class="form-control form-control-lg border-primary" placeholder="Enter Task ID"
        [(ngModel)]="taskid" name="taskid" required />
    </div>

    <div class="form-group mb-4">
      <label for="description" class="form-label fw-semibold">Description</label>
      <textarea id="description" rows="4" class="form-control form-control-lg border-success"
        placeholder="Write task description..." [(ngModel)]="description" name="description" required></textarea>
    </div>

    <div class="form-group mb-4">
      <label class="form-label fw-semibold">Status</label>
      <div class="d-flex gap-4 mt-2">
        <label class="form-check-label d-flex align-items-center gap-2">
          <input type="radio" name="status" [(ngModel)]="status" value="Pending" class="form-check-input" />
          <span class="badge bg-warning text-dark px-3 py-2 rounded-pill">Pending</span>
        </label>

        <label class="form-check-label d-flex align-items-center gap-2">
          <input type="radio" name="status" [(ngModel)]="status" value="Success" class="form-check-input" />
          <span class="badge bg-success px-3 py-2 rounded-pill">Success</span>
        </label>
      </div>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-lg btn-primary px-5">
        {{ editIndex !== null ? 'Update Task' : 'Add Task' }}
      </button>
    </div>
  </form>
</div>
